---
name: docker

display_name: Docker Host

version: 1.0.0

author: Homelab Infrastructure Management Platform

description: >
  Collects discovery, health, and reporting information
  for Docker hosts.

entrypoint: tasks/main.yml

inventory_group: docker

supports:
  discovery: true
  health: true
  reporting: true

artifacts:
  - service_status
  - containers
  - health_score
  - plugins.docker

requirements:
  - systemd
