---
###############################################################################
# Technitium Discovery
###############################################################################

- name: Check Technitium service status
  ansible.builtin.systemd:
    name: technitium
  register: technitium_service
  changed_when: false
  failed_when: false

- name: Check Technitium binary
  ansible.builtin.stat:
    path: /opt/technitium/dns/DnsServerApp.dll
  register: technitium_binary

- name: Build Technitium plugin data
  ansible.builtin.set_fact:
    technitium_plugin:
      installed: "{{ technitium_binary.stat.exists | default(false) }}"
      service: technitium.service
      status: "{{ technitium_service.status.ActiveState | default('unknown') }}"
      install_path: /opt/technitium/dns
      metadata:
        build_time: "{{ technitium_binary.stat.mtime | default(0) }}"

- name: Store Technitium discovery data
  ansible.builtin.set_fact:
    homelab_report: >-
      {{
        homelab_report |
        combine({
          'plugins': {
            'technitium': technitium_plugin
          }
        }, recursive=True)
      }}
