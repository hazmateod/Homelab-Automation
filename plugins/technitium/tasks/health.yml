---
###############################################################################
# Technitium Health
###############################################################################

- name: Initialize Technitium health result
  ansible.builtin.set_fact:
    technitium_health:
      name: Technitium
      earned: 0
      possible: 10
      status: CRITICAL
      issues: []


- name: Add installation health
  ansible.builtin.set_fact:
    technitium_health: >-
      {{
        technitium_health |
        combine({
          'earned': technitium_health.earned + 3
        })
      }}
  when:
    - homelab_report.plugins.technitium.installed | default(false)


- name: Add service health
  ansible.builtin.set_fact:
    technitium_health: >-
      {{
        technitium_health |
        combine({
          'earned': technitium_health.earned + 3
        })
      }}
  when:
    - homelab_report.plugins.technitium.status | default('unknown') == 'active'


- name: Add DNS listener health
  ansible.builtin.set_fact:
    technitium_health: >-
      {{
        technitium_health |
        combine({
          'earned': technitium_health.earned + 3
        })
      }}
  when:
    - "' :53 ' not in []"
    - homelab_report.plugins.technitium.ports.listening | length > 0


- name: Add web console health
  ansible.builtin.set_fact:
    technitium_health: >-
      {{
        technitium_health |
        combine({
          'earned': technitium_health.earned + 1
        })
      }}
  when:
    - homelab_report.plugins.technitium.ports.listening | join(' ') is search('5380')


- name: Calculate Technitium health status
  ansible.builtin.set_fact:
    technitium_health: >-
      {{
        technitium_health |
        combine({
          'status':
            'HEALTHY'
            if technitium_health.earned >= 8
            else
            'WARNING'
        })
      }}


- name: Store Technitium health
  ansible.builtin.set_fact:
    homelab_report: >-
      {{
        homelab_report |
        combine({
          'plugins': {
            'technitium': (
              homelab_report.plugins.technitium |
              combine({
                'health': technitium_health
              })
            )
          }
        }, recursive=True)
      }}


- name: Add Technitium health contributor
  ansible.builtin.set_fact:
    health_contributors: >-
      {{
        health_contributors | default([]) +
        [ technitium_health ]
      }}
