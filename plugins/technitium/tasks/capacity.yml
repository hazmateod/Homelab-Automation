---
- name: Read root filesystem block and inode usage
  ansible.builtin.command:
    argv: [timeout, "5", df, -k, "--output=size,avail,pcent,itotal,iavail,ipcent", /]
  environment:
    LC_ALL: C
  register: technitium_disk
  changed_when: false
  failed_when: false
  check_mode: false

- name: Measure Technitium log and backup directories on their own filesystems
  ansible.builtin.command:
    argv: [timeout, "15", du, -sxB1, --, "{{ item }}"]
  loop:
    - /var/log/technitium/dns
    - /root/backups
  register: technitium_directory_sizes
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Read dated query log metadata
  ansible.builtin.command:
    argv:
      - timeout
      - "10"
      - find
      - /var/log/technitium/dns
      - -maxdepth
      - "1"
      - -type
      - f
      - -name
      - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].log"
      - -printf
      - '%T@\n'
  register: technitium_log_ages
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Check whether the expected retention job exists and is executable
  ansible.builtin.stat:
    path: /etc/cron.daily/technitium-log-retention
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: technitium_retention_job
  failed_when: false

- name: Record aggregate capacity evidence
  ansible.builtin.set_fact:
    technitium_capacity: "{{ technitium_disk | technitium_capacity_report(technitium_directory_sizes.results, technitium_log_ages, technitium_retention_job.stat | default({}), homelab_report.plugins.technitium.observed_at) }}"
  no_log: true
