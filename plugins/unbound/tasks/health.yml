---
###############################################################################
# Unbound Health
###############################################################################

- name: Initialize Unbound health result
  ansible.builtin.set_fact:
    unbound_health:
      name: Unbound
      earned: 0
      possible: 10
      status: CRITICAL
      issues: []

- name: Add installation health
  ansible.builtin.set_fact:
    unbound_health: >-
      {{
        unbound_health |
        combine({
          'earned': unbound_health.earned + 3
        })
      }}
  when:
    - homelab_report.plugins.unbound.installed | default(false)

- name: Add service health
  ansible.builtin.set_fact:
    unbound_health: >-
      {{
        unbound_health |
        combine({
          'earned': unbound_health.earned + 4
        })
      }}
  when:
    - homelab_report.plugins.unbound.status | default('unknown') == 'active'

- name: Add configuration health
  ansible.builtin.set_fact:
    unbound_health: >-
      {{
        unbound_health |
        combine({
          'earned': unbound_health.earned + 3
        })
      }}
  when:
    - homelab_report.plugins.unbound.metadata.config_present | default(false)

- name: Calculate Unbound health status
  ansible.builtin.set_fact:
    unbound_health: >-
      {{
        unbound_health |
        combine({
          'status':
            'HEALTHY'
            if unbound_health.earned >= 8
            else
            'WARNING'
        })
      }}

- name: Record Unbound issue
  ansible.builtin.set_fact:
    unbound_health: >-
      {{
        unbound_health |
        combine({
          'issues':
            unbound_health.issues +
            ['Unbound service is not active']
        })
      }}
  when:
    - homelab_report.plugins.unbound.status | default('unknown') != 'active'

- name: Store Unbound health
  ansible.builtin.set_fact:
    homelab_report: >-
      {{
        homelab_report |
        combine({
          'plugins': {
            'unbound': (
              homelab_report.plugins.unbound |
              combine({
                'health': unbound_health
              })
            )
          }
        }, recursive=True)
      }}

- name: Add Unbound health contributor
  ansible.builtin.set_fact:
    health_contributors: >-
      {{
        health_contributors | default([]) +
        [ unbound_health ]
      }}
