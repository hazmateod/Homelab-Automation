---
###############################################################################
# Unbound Discovery
###############################################################################

- name: Check Unbound service status
  ansible.builtin.systemd:
    name: unbound
  register: unbound_service
  changed_when: false
  failed_when: false

- name: Check Unbound binary
  ansible.builtin.stat:
    path: /usr/sbin/unbound
  register: unbound_binary

- name: Check Unbound configuration
  ansible.builtin.stat:
    path: /etc/unbound
  register: unbound_config

- name: Build Unbound plugin data
  ansible.builtin.set_fact:
    unbound_plugin:
      installed: "{{ unbound_binary.stat.exists | default(false) }}"
      service: unbound.service
      status: "{{ unbound_service.status.ActiveState | default('unknown') }}"
      binary: /usr/sbin/unbound
      configuration_path: /etc/unbound
      metadata:
        config_present: "{{ unbound_config.stat.exists | default(false) }}"
        build_time: "{{ unbound_binary.stat.mtime | default(0) }}"

- name: Store Unbound discovery data
  ansible.builtin.set_fact:
    homelab_report: >-
      {{
        homelab_report |
        combine({
          'plugins': {
            'unbound': unbound_plugin
          }
        }, recursive=True)
      }}
