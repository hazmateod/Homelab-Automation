---
name: pihole

display_name: Pi-hole DNS

version: 1.0.0

author: Homelab Infrastructure Management Platform

description: >
  Collects discovery, health, validation,
  and reporting information for Pi-hole DNS.

entrypoint: tasks/main.yml

supports:
  discovery: true
  health: true
  reporting: true
  validation: true

artifacts:
  - service_status
  - version
  - gravity_status
  - dns_statistics
  - plugins.pihole

requirements:
  - systemd
  - pihole
