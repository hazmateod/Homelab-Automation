---
###############################################################################
# PBS Discovery
###############################################################################

- name: Check PBS service status
  ansible.builtin.systemd:
    name: proxmox-backup
  register: pbs_service
  changed_when: false
  failed_when: false

- name: Check PBS manager
  ansible.builtin.command:
    cmd: which proxmox-backup-manager
  register: pbs_manager
  changed_when: false
  failed_when: false

- name: Gather datastore list
  ansible.builtin.command:
    cmd: proxmox-backup-manager datastore list --output-format json
  register: pbs_datastores
  changed_when: false
  failed_when: false

- name: Parse datastore list
  ansible.builtin.set_fact:
    pbs_datastore_data: "{{ pbs_datastores.stdout | default('[]') | from_json }}"
  when:
    - pbs_datastores.rc == 0

- name: Initialize empty datastore list
  ansible.builtin.set_fact:
    pbs_datastore_data: []
  when:
    - pbs_datastores.rc != 0

- name: Build PBS plugin data
  ansible.builtin.set_fact:
    pbs_plugin:
      installed: "{{ pbs_manager.rc == 0 }}"
      service: proxmox-backup.service
      status: "{{ pbs_service.status.ActiveState | default('unknown') }}"
      metadata:
        datastore_count: "{{ pbs_datastore_data | length }}"
      datastores: "{{ pbs_datastore_data }}"

- name: Store PBS discovery data
  ansible.builtin.set_fact:
    homelab_report: >-
      {{
        homelab_report |
        combine({
          'plugins': {
            'pbs': pbs_plugin
          }
        }, recursive=True)
      }}
