---
###############################################################################
# PBS Health
###############################################################################

- name: Initialize PBS health result
  ansible.builtin.set_fact:
    pbs_health:
      name: PBS
      earned: 0
      possible: 10
      status: CRITICAL
      issues: []

- name: Add installation health
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 3
        })
      }}
  when:
    - homelab_report.plugins.pbs.installed | default(false)

- name: Add service health
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 4
        })
      }}
  when:
    - homelab_report.plugins.pbs.status | default('unknown') == 'active'

- name: Add datastore health
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 3
        })
      }}
  when:
    - (homelab_report.plugins.pbs.metadata.datastore_count | default(0) | int) > 0

- name: Calculate PBS health status
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'status':
            'HEALTHY'
            if pbs_health.earned >= 8
            else
            'WARNING'
        })
      }}

- name: Record PBS issue
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'issues':
            pbs_health.issues +
            ['PBS service is not active']
        })
      }}
  when:
    - homelab_report.plugins.pbs.status | default('unknown') != 'active'

- name: Store PBS health
  ansible.builtin.set_fact:
    homelab_report: >-
      {{
        homelab_report |
        combine({
          'plugins': {
            'pbs': (
              homelab_report.plugins.pbs |
              combine({
                'health': pbs_health
              })
            )
          }
        }, recursive=True)
      }}

- name: Add PBS health contributor
  ansible.builtin.set_fact:
    health_contributors: >-
      {{
        health_contributors | default([]) +
        [ pbs_health ]
      }}
