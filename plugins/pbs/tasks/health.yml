---
###############################################################################
# PBS Health
###############################################################################

- name: Initialize PBS health result
  ansible.builtin.set_fact:
    pbs_health:
      name: PBS
      earned: 0
      possible: 10
      status: CRITICAL
      issues: []

- name: Check PBS service health
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 3
        })
      }}
  when:
    - pbs_service.status.ActiveState | default('unknown') == "active"

- name: Check PBS manager health
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 1
        })
      }}
  when:
    - pbs_manager.rc == 0

- name: Check PBS version health
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 1
        })
      }}
  when:
    - pbs_version.rc == 0

- name: Check PBS datastore availability
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 2
        })
      }}
  when:
    - pbs_datastores.rc == 0

- name: Check PBS datastore path
  ansible.builtin.stat:
    path: "{{ pbs_datastore_path }}"
  register: pbs_backup_path

- name: Check PBS datastore filesystem usage
  ansible.builtin.shell:
    cmd: df -P "{{ pbs_datastore_path }}" | tail -1 | awk '{print $5}' | tr -d '%'
  register: pbs_storage_usage
  changed_when: false
  failed_when: false

- name: Add datastore path health
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 1
        })
      }}
  when:
    - pbs_backup_path.stat.exists

- name: Add storage capacity health
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 1
        })
      }}
  when:
    - pbs_storage_usage.rc == 0
    - (pbs_storage_usage.stdout | int) < 90

- name: Check PBS datastore accessibility
  ansible.builtin.stat:
    path: "{{ pbs_datastore_path }}"
  register: pbs_datastore_access

- name: Add datastore accessibility health
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'earned': pbs_health.earned + 1
        })
      }}
  when:
    - pbs_datastore_access.stat.readable | default(false)

- name: Calculate PBS health status
  ansible.builtin.set_fact:
    pbs_health: >-
      {{
        pbs_health |
        combine({
          'status':
            'HEALTHY'
            if pbs_health.earned >= 8
            else 'WARNING'
        })
      }}

- name: Add PBS health contributor
  ansible.builtin.set_fact:
    health_contributors: >-
      {{
        health_contributors | default([]) + [ pbs_health ]
      }}
