---
name: pbs

display_name: Proxmox Backup Server

version: 1.0.0

author: Homelab Infrastructure Management Platform

description: >
  Collects discovery, health, validation,
  and reporting information for Proxmox Backup Server.

entrypoint: tasks/main.yml

supports:
  discovery: true
  health: true
  reporting: true
  validation: true

artifacts:
  - service_status
  - version
  - datastores
  - storage
  - plugins.pbs

requirements:
  - systemd
  - proxmox-backup-manager
