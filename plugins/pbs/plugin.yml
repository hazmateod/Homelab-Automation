---
name: pbs

display_name: Proxmox Backup Server

version: 1.0.0

author: Homelab Infrastructure Management Platform

description: >
  Collects discovery, health, and reporting information
  for Proxmox Backup Server.

entrypoint: tasks/main.yml

inventory_group: backup

supports:
  discovery: true
  health: true
  reporting: true

artifacts:
  - service_status
  - datastores
  - health_score
  - plugins.pbs

requirements:
  - systemd
