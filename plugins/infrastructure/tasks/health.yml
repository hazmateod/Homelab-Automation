---
###############################################################################
# Infrastructure Health
###############################################################################

- name: Initialize infrastructure health
  ansible.builtin.set_fact:
    infrastructure_health:
      name: Infrastructure Services
      earned: 0
      possible: 8
      status: CRITICAL
      issues: []


- name: Add host connectivity
  ansible.builtin.set_fact:
    infrastructure_health:
      "{{ infrastructure_health | combine({
        'earned':
          infrastructure_health.earned + 1
      }) }}"


- name: Check disk usage
  ansible.builtin.shell:
    cmd: df / --output=pcent | tail -1 | tr -dc '0-9'
  register: disk_percent
  changed_when: false


- name: Add disk health
  ansible.builtin.set_fact:
    infrastructure_health:
      "{{ infrastructure_health | combine({
        'earned':
          infrastructure_health.earned + 2
      }) }}"
  when:
    - disk_percent.stdout | int < 85


- name: Add uptime health
  ansible.builtin.set_fact:
    infrastructure_health:
      "{{ infrastructure_health | combine({
        'earned':
          infrastructure_health.earned + 1
      }) }}"
  when:
    - uptime_info.stdout is defined


###############################################################################
# Role based service checks
###############################################################################

- name: Validate aptcache service
  ansible.builtin.set_fact:
    required_service: apt-cacher-ng.service
  when:
    - infrastructure_role == "aptcache"


- name: Validate postgres service
  ansible.builtin.set_fact:
    required_service: postgresql.service
  when:
    - infrastructure_role == "postgres"


- name: Validate uptimekuma service
  ansible.builtin.set_fact:
    required_service: uptime-kuma.service
  when:
    - infrastructure_role == "uptimekuma"


- name: Validate urbackup service
  ansible.builtin.set_fact:
    required_service: urbackupserver.service
  when:
    - infrastructure_role == "urbackup"


- name: Validate mailarchiver service
  ansible.builtin.set_fact:
    required_service: postfix.service
  when:
    - infrastructure_role == "mailarchiver"


- name: Check required service
  ansible.builtin.set_fact:
    infrastructure_service_status:
      "{{ ansible_facts.services[required_service].state | default('missing') }}"
  when:
    - required_service is defined


- name: Check required process
  ansible.builtin.shell:
    cmd: >-
      pgrep -f "{{ required_service | regex_replace('.service', '') }}"
  register: required_process
  changed_when: false
  failed_when: false
  when:
    - required_service is defined


- name: Add required service health
  ansible.builtin.set_fact:
    infrastructure_health:
      "{{ infrastructure_health | combine({
        'earned':
          infrastructure_health.earned + 4
      }) }}"
  when:
    - >
      infrastructure_service_status | default('missing')
      in ['running','active']
      or required_process.rc == 0


- name: Add service issue
  ansible.builtin.set_fact:
    infrastructure_health:
      "{{ infrastructure_health | combine({
        'issues':
          infrastructure_health.issues +
          ['Required service unavailable: ' ~ required_service]
      }) }}"
  when:
    - required_service is defined
    - infrastructure_service_status | default('missing') not in ['running','active']
    - required_process.rc != 0


###############################################################################
# Final scoring
###############################################################################

- name: Calculate infrastructure status
  ansible.builtin.set_fact:
    infrastructure_health:
      "{{ infrastructure_health | combine({
        'status':
          'HEALTHY'
          if infrastructure_health.earned >= 8
          else
          'WARNING'
      }) }}"


- name: Store infrastructure health
  ansible.builtin.set_fact:
    homelab_report:
      "{{ homelab_report | combine({
        'plugins': {
          'infrastructure': {
            'health':
              infrastructure_health
          }
        }
      }, recursive=True) }}"


- name: Add infrastructure contributor
  ansible.builtin.set_fact:
    health_contributors:
      "{{ health_contributors | default([]) +
      [ infrastructure_health ] }}"
