# HIMP production SSH hardening
#
# Human administration is performed using the lou account with
# public-key authentication and sudo privilege escalation.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

X11Forwarding no
AllowTcpForwarding no
GatewayPorts no
PermitUserEnvironment no

# Remove algorithms reported by the Greenbone baseline.
#
# AES-GCM/CTR are retained for compatibility.
# ChaCha20-Poly1305 is intentionally excluded from this host policy.
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

# Restrict MACs to SHA-2 Encrypt-then-MAC algorithms.
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
