---
- name: Execute HIMP Plugin Functional Evidence
  hosts: "{{ inventory_group }}"
  gather_facts: false
  become: true

  tasks:

    - name: Validate functional evidence parameters
      ansible.builtin.assert:
        that:
          - plugin is defined
          - plugin | length > 0
          - inventory_group is defined
          - inventory_group | length > 0
        fail_msg: >-
          Plugin or inventory_group parameter
          was not supplied.

    - name: Initialize functional evidence observation
      ansible.builtin.set_fact:
        himp_functional_evidence_observation: {}

    - name: Execute plugin functional evidence
      ansible.builtin.include_tasks:
        file: >-
          ../plugins/{{ plugin }}/tasks/functional_evidence.yml

    - name: Save host functional evidence result
      ansible.builtin.set_fact:
        host_functional_evidence_result:
          hostname: "{{ inventory_hostname }}"
          observation: >-
            {{
              himp_functional_evidence_observation
              | default({})
            }}

    - name: Aggregate functional evidence results
      ansible.builtin.set_fact:
        aggregated_functional_evidence:
          plugin: "{{ plugin }}"
          inventory_group: "{{ inventory_group }}"
          hosts: >-
            {{
              groups[inventory_group]
              | map('extract', hostvars)
              | map(
                  attribute='host_functional_evidence_result',
                  default={}
                )
              | list
            }}
      delegate_to: localhost
      become: false
      run_once: true

    - name: Create functional evidence output directory
      ansible.builtin.file:
        path: >-
          {{ playbook_dir }}/../reports/functional_evidence
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Write raw functional evidence document
      ansible.builtin.copy:
        dest: >-
          {{ playbook_dir }}/../reports/functional_evidence/{{ plugin }}.json
        content: >-
          {{ aggregated_functional_evidence | to_nice_json }}
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true
