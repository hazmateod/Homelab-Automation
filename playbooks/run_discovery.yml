---
- name: Execute HIMP Plugin Discovery
  hosts: "{{ inventory_group }}"
  gather_facts: true
  become: true

  tasks:

    - name: Validate plugin parameter
      ansible.builtin.assert:
        that:
          - plugin is defined
          - plugin | length > 0
          - inventory_group is defined
          - inventory_group | length > 0
        fail_msg: Plugin or inventory_group parameter was not supplied.

    - name: Initialize HIMP runtime
      ansible.builtin.set_fact:
        homelab_report: {}
        homelab_plugin: "{{ plugin }}"

    - name: Execute plugin discovery
      ansible.builtin.include_tasks:
        file: "../plugins/{{ plugin }}/tasks/discovery.yml"

    - name: Create discovery output directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../reports/discovery"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Write discovery document
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../reports/discovery/{{ plugin }}.json"
        content: "{{ homelab_report | to_nice_json }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true
