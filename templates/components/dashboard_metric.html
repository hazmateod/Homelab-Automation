{% macro dashboard_metric(label, value, color="dark", text_color="light") %}
<div class="col-md-3">
    <div class="card bg-{{ color }} text-{{ text_color }} mb-4">
        <div class="card-body">
            <h6>{{ label }}</h6>
            <h3>{{ value }}</h3>
        </div>
    </div>
</div>
{% endmacro %}
