{% macro health_summary_card(card) %}

<div class="col-md-4">

    <div class="card bg-dark text-light border-secondary mb-4">

        <div class="card-body">

            <h5>
                {{ card.plugin }}
            </h5>


            {% if card.status == "HEALTHY" %}

            <span class="badge bg-success">
                HEALTHY
            </span>

            {% elif card.status == "WARNING" %}

            <span class="badge bg-warning text-dark">
                WARNING
            </span>

            {% else %}

            <span class="badge bg-danger">
                {{ card.status }}
            </span>

            {% endif %}


            <p class="mt-3 mb-1">
                Score:
                {{ card.earned }}/{{ card.possible }}
            </p>


            <small class="text-secondary">

                Hosts:
                {{ card.hosts }}

            </small>

        </div>

    </div>

</div>

{% endmacro %}
