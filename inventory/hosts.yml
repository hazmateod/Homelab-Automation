        unbound108:
          ansible_host: 10.10.37.8
          ansible_user: lou
          ansible_become: true

        unbound37100:
          ansible_host: 192.168.37.100
          ansible_user: root

        unbound37101:
          ansible_host: 192.168.37.101
          ansible_user: root

        unbound1007:
          ansible_host: 192.168.10.7
          ansible_user: root

        unbound1008:
          ansible_host: 192.168.10.8
          ansible_user: root

    #########################################
