          ansible_user: lou
          ansible_become: true

    #########################################
    # Docker Hosts
    #########################################

    docker:
      hosts:

        dockerhost:
          ansible_host: 192.168.10.40
          ansible_user: lou
          ansible_become: true

    #########################################
    # Misc
    #########################################

    #########################################
    # Automated Maintenance
    #########################################

    # Hosts safe for scheduled package maintenance.
    # Proxmox and PBS are intentionally excluded.
    maintenance:
      children:
        unbound:
        technitium:
        pihole:
        infrastructure:
        vpn:
        media:
        misc:

    misc:
      hosts:

        dnsbalancer:
          ansible_host: 192.168.37.13
          ansible_user: lou
          ansible_become: true
