---
###############################################################################
# HIMP Report Pipeline
###############################################################################

- name: Discover host
  ansible.builtin.include_role:
    name: discovery

- name: Build CMDB data
  ansible.builtin.include_role:
    name: cmdb

- name: Export JSON
  import_tasks: export_json.yml

- name: Export Markdown
  import_tasks: export_markdown.yml
