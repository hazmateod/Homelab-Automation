---
- name: Resolve CMDB report identity
  vars:
    binding: "{{ (himp_host_bindings | default({})).get(inventory_hostname, {}) }}"
  ansible.builtin.set_fact:
    cmdb_report_identity: >-
      {{
        {'host_id': binding.host_id, 'incarnation': binding.incarnation}
        if binding and binding.ip == (ansible_host | default(''))
        and binding.user == (ansible_user | default(''))
        else {}
      }}

- name: Choose CMDB JSON output directory
  ansible.builtin.set_fact:
    cmdb_json_directory: >-
      {{ playbook_dir }}/../reports/json{{ '' if cmdb_report_identity else '/unverified' }}

- name: Ensure JSON report directory exists
  ansible.builtin.file:
    path: "{{ cmdb_json_directory }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Export CMDB as JSON
  ansible.builtin.copy:
    dest: "{{ cmdb_json_directory }}/{{ inventory_hostname }}.json"
    content: "{{ (cmdb | combine({'host_identity': cmdb_report_identity} if cmdb_report_identity else {})) | to_nice_json }}"
    mode: "0644"
  delegate_to: localhost
  become: false
