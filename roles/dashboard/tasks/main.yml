---
- name: Ensure dashboard directory exists
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../reports/dashboard"
    state: directory
    mode: "0755"

- name: Require reports selected by HIMP
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - himp_dashboard_reports is defined
      - himp_dashboard_reports is sequence
      - himp_dashboard_reports is not string
      - himp_dashboard_reports is not mapping
    fail_msg: Run dashboard generation through HIMP to select current reports.

- name: Select reports for current Ansible inventory
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    dashboard_hosts: >-
      {{ himp_dashboard_reports | selectattr('metadata.hostname', 'in', groups['all']) | list }}

- name: Generate dashboard JSON
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: dashboard.json.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/dashboard.json"

- name: Generate dashboard HTML
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/index.html"

- name: Generate dashboard CSS
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: style.css.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/style.css"

- name: Generate dashboard JavaScript
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: dashboard.js.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/dashboard.js"

- name: Display dashboard summary
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.debug:
    msg:
      - "Dashboard generated."
      - "Hosts: {{ dashboard_hosts | default([]) | length }}"
      - "Unreadable or malformed reports skipped: {{ himp_dashboard_skipped_reports | default([]) | to_json }}"
