---
- name: Ensure dashboard directory exists
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../reports/dashboard"
    state: directory
    mode: "0755"

- name: Find JSON reports
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths:
      - "{{ playbook_dir }}/../reports/json"
      - "{{ playbook_dir }}/../reports/json/unverified"
    patterns: "*.json"
  register: dashboard_json

- name: Read current report bindings
  run_once: true
  delegate_to: localhost
  become: false
  changed_when: false
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "-c"
      - "import json; from himp.database.host_identity import HostIdentityRepository; print(json.dumps(HostIdentityRepository().report_bindings()))"
    chdir: "{{ playbook_dir }}/.."
  register: dashboard_report_bindings

- name: Read JSON reports
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    dashboard_hosts: >-
      {{
        dashboard_hosts | default([])
        + [candidate]
      }}
  loop: "{{ dashboard_json.files }}"
  vars:
    bindings: "{{ dashboard_report_bindings.stdout | from_json }}"
    hostname: "{{ item.path | basename | splitext | first }}"
    candidate: "{{ lookup('file', item.path) | from_json }}"
    canonical_names: >-
      {{
        dashboard_json.files
        | rejectattr('path', 'search', '/unverified/[^/]+$')
        | map(attribute='path') | map('basename') | list
      }}
  when:
    - hostname in groups['all']
    - >-
      (hostname not in bindings and candidate.host_identity is not defined)
      or (bindings.get(hostname) is not none and candidate.host_identity | default(none) == bindings[hostname])
    - (item.path | dirname | basename) != 'unverified' or (item.path | basename) not in canonical_names

- name: Generate dashboard JSON
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: dashboard.json.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/dashboard.json"

- name: Generate dashboard HTML
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/index.html"

- name: Generate dashboard CSS
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: style.css.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/style.css"

- name: Generate dashboard JavaScript
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: dashboard.js.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/dashboard.js"

- name: Display dashboard summary
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.debug:
    msg:
      - "Dashboard generated."
      - "Hosts: {{ dashboard_hosts | default([]) | length }}"
