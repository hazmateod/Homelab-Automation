---
- name: Ensure dashboard directory exists
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../reports/dashboard"
    state: directory
    mode: "0755"

- name: Find JSON reports
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../reports/json"
    patterns: "*.json"
  register: dashboard_json

- name: Initialize dashboard host list
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    dashboard_hosts: []

- name: Read JSON reports
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    dashboard_hosts: >-
      {{
        dashboard_hosts
        + [
            lookup(
              'file',
              item.path
            )
            | from_json
          ]
      }}
  loop: "{{ dashboard_json.files }}"

- name: Generate dashboard JSON
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: dashboard.json.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/dashboard.json"

- name: Generate dashboard HTML
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/index.html"

- name: Generate dashboard CSS
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: style.css.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/style.css"

- name: Generate dashboard JavaScript
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: dashboard.js.j2
    dest: "{{ playbook_dir }}/../reports/dashboard/dashboard.js"

- name: Display dashboard summary
  run_once: true
  delegate_to: localhost
  become: false
  ansible.builtin.debug:
    msg:
      - "Dashboard generated."
      - "Hosts: {{ dashboard_hosts | length }}"
