---
- name: Build hardware section
  ansible.builtin.set_fact:
    cmdb_hardware:
      cpu:
        model: "{{ ansible_processor | last | default('Unknown') }}"
        sockets: "{{ ansible_processor_count | default(1) }}"
        cores_per_socket: "{{ ansible_processor_cores | default(0) }}"
        vcpus: "{{ ansible_processor_vcpus | default(0) }}"

      memory:
        total_mb: "{{ ansible_memtotal_mb }}"
        free_mb: "{{ ansible_memfree_mb }}"
        used_mb: "{{ ansible_memtotal_mb - ansible_memfree_mb }}"
        total_gb: "{{ (ansible_memtotal_mb / 1024) | round(2) }}"
        free_gb: "{{ (ansible_memfree_mb / 1024) | round(2) }}"
        used_gb: "{{ ((ansible_memtotal_mb - ansible_memfree_mb) / 1024) | round(2) }}"
