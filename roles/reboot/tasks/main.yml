---
- name: Check if reboot required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot host
  ansible.builtin.reboot:
    reboot_timeout: 900
  when: reboot_required.stat.exists
  register: reboot_result

- name: Wait for SSH
  ansible.builtin.wait_for_connection:
    timeout: 600
  when: reboot_required.stat.exists

- name: Store reboot results
  ansible.builtin.set_fact:
    homelab_report: >-
      {{
        homelab_report |
        combine({
          'reboot': {
            'required': reboot_required.stat.exists,
            'performed': reboot_required.stat.exists,
            'successful': (
              reboot_result is defined and
              reboot_result.failed is not defined
            )
            if reboot_required.stat.exists else true
          }
        }, recursive=True)
      }}

- name: Display Reboot Report
  ansible.builtin.debug:
    var: homelab_report.reboot
