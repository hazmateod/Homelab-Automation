---
###############################################################################
# Plugin Loader
###############################################################################

- name: Verify plugin variable exists
  ansible.builtin.assert:
    that:
      - plugin is defined
    fail_msg: "No plugin defined for host."

- name: Load plugin manifest
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../plugins/{{ plugin }}/plugin.yml"
    name: plugin_manifest

- name: Display plugin manifest
  ansible.builtin.debug:
    var: plugin_manifest

- name: Execute plugin entrypoint
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../plugins/{{ plugin }}/{{ plugin_manifest.entrypoint }}"
